name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint source code
        run: npm run lint

      - name: Run unit test coverage
        run: npm run coverage

      - name: Run extension tests (Linux)
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            xvfb-run -a npm test && break || {
              if [ $i -lt 3 ]; then
                echo "Test attempt $i failed, retrying in 5s..."
                sleep 5
              else
                exit 1
              fi
            }
          done

      - name: Run extension tests (macOS & Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          for i in 1 2 3; do
            npm test && break || {
              if [ $i -lt 3 ]; then
                echo "Test attempt $i failed, retrying in 5s..."
                sleep 5
              else
                exit 1
              fi
            }
          done
