name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to **Auto Optional Chainer**! Thank you for opening your first issue.
            Our maintainers will review it shortly. Please make sure you have included code snippets and environment details if reporting a bug.
          pr-message: |
            🎉 Welcome and thank you for opening your first pull request for **Auto Optional Chainer**!
            Please make sure tests and linter checks pass locally (`npm run test:unit`, `npm run lint`). A maintainer will review your contribution soon!
