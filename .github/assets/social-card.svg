<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Grid decoration lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640" />
    <line x1="240" y1="0" x2="240" y2="640" />
    <line x1="400" y1="0" x2="400" y2="640" />
    <line x1="560" y1="0" x2="560" y2="640" />
    <line x1="720" y1="0" x2="720" y2="640" />
    <line x1="880" y1="0" x2="880" y2="640" />
    <line x1="1040" y1="0" x2="1040" y2="640" />
    <line x1="1200" y1="0" x2="1200" y2="640" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="200" x2="1280" y2="200" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="440" x2="1280" y2="440" />
    <line x1="0" y1="560" x2="1280" y2="560" />
  </g>

  <!-- Brand Card -->
  <g transform="translate(100, 100)">
    <!-- Pill Badge -->
    <rect width="210" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="24" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="bold" letter-spacing="1">⚡ VS CODE EXTENSION</text>

    <!-- Project Title -->
    <text x="0" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800">
      Auto Optional Chainer
    </text>

    <!-- Tagline -->
    <text x="0" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Automate safe property chaining in JavaScript &amp; TypeScript with precision.
    </text>

    <!-- Key highlights -->
    <g transform="translate(0, 210)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="26" fill="#f8fafc">✨ One-Key (Cmd+O)</text>

      <rect x="180" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="200" y="26" fill="#f8fafc">💾 Auto on Save</text>

      <rect x="360" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="380" y="26" fill="#f8fafc">🛡️ String-Safe</text>

      <rect x="540" y="0" width="150" height="42" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="560" y="26" fill="#f8fafc">💚 Fully Open Source</text>
    </g>
  </g>

  <!-- Interactive Code Preview Window -->
  <g transform="translate(100, 390)" filter="url(#shadow)">
    <rect width="1080" height="180" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />

    <!-- Terminal Titlebar dots -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="96" y="29" fill="#6b7280" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="13">transformation.ts — Auto Optional Chainer</text>

    <!-- Code transformation comparison -->
    <g transform="translate(28, 70)" font-family="'Fira Code', Menlo, Consolas, monospace" font-size="16">
      <!-- Input line -->
      <text x="0" y="20">
        <tspan fill="#ef4444">❌ Before:  </tspan>
        <tspan fill="#c084fc">const </tspan>
        <tspan fill="#93c5fd">street </tspan>
        <tspan fill="#94a3b8">= </tspan>
        <tspan fill="#f1f5f9">user</tspan><tspan fill="#cbd5e1">.</tspan><tspan fill="#f1f5f9">address</tspan><tspan fill="#cbd5e1">.</tspan><tspan fill="#f1f5f9">street</tspan><tspan fill="#94a3b8">;</tspan>
      </text>

      <!-- Output line -->
      <text x="0" y="60">
        <tspan fill="#10b981">✅ After:   </tspan>
        <tspan fill="#c084fc">const </tspan>
        <tspan fill="#93c5fd">street </tspan>
        <tspan fill="#94a3b8">= </tspan>
        <tspan fill="#f1f5f9">user</tspan><tspan fill="#38bdf8" font-weight="bold">?.</tspan><tspan fill="#f1f5f9">address</tspan><tspan fill="#38bdf8" font-weight="bold">?.</tspan><tspan fill="#f1f5f9">street</tspan><tspan fill="#94a3b8">;</tspan>
      </text>
    </g>
  </g>
</svg>
